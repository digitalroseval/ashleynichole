<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Ashley Nichole</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;background:#080809;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif}
    body{min-height:100vh}
    .page{width:min(100%,700px);margin:auto;padding-bottom:40px}
    .hero{height:min(78vw,520px);min-height:300px;position:relative;overflow:hidden;background:#121214}
    .hero img{width:100%;height:100%;object-fit:cover;object-position:center;display:block}
    .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.03) 35%,#080809 100%)}
    .content{position:relative;z-index:2;margin-top:-66px;padding:0 24px}
    .name{text-align:center;font-size:36px;line-height:1.05;font-weight:800;margin:0}
    .verified{display:inline-grid;place-items:center;width:25px;height:25px;border-radius:50%;background:#168cff;font-size:15px;vertical-align:5px;margin-left:4px}
    .handle{text-align:center;color:#aaa;font-size:17px;margin-top:8px}
    .location{text-align:center;color:#bdbdc3;font-size:14px;margin-top:7px}
    .online-dot{color:#39d353;font-size:11px;vertical-align:1px}
    .pin{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-size:13px;vertical-align:-1px}
    .socials{display:flex;justify-content:center;margin:24px 0 42px}
    .socials a{width:58px;height:58px;border-radius:50%;background:#151519;border:1px solid #2b2b31;display:grid;place-items:center}
    .socials svg{width:29px;height:29px;fill:none;stroke:#fff;stroke-width:2}
    .links{display:grid;gap:18px}
    .onlyfans-button{display:block;width:100%;padding:18px 22px;border-radius:18px;background:#151519;border:1px solid #2b2b31;color:#fff;text-align:center;text-decoration:none;font-size:17px;font-weight:700;box-shadow:0 12px 30px rgba(0,0,0,.25)}
    @media(min-width:700px){.hero{height:520px}.content{padding:0 30px}}
  </style>
</head>
<body>
  <main class="page">
    <section class="hero"><img src="media/AN2.jpg" alt="Ashley Nichole"></section>
    <section class="content">
      <h1 class="name">Ashley Nichole <span class="verified">✓</span></h1>
      <div class="handle">@ashleynichole</div>
      <div class="location"><span class="online-dot">●</span> Online · <span class="pin" aria-hidden="true">📍</span> <span id="city">Locating...</span></div>
      <nav class="socials">
        <a href="https://www.instagram.com/ashley_nichole801" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="#fff" stroke="none"></circle></svg>
        </a>
      </nav>
      <div class="links">
        <a class="card" href="https://onlyfans.com/onlyashleybaby/c5" target="_blank" rel="noopener noreferrer" class="onlyfans-button">OnlyFans</a>
        </a>
      </div>
    </section>
  </main>
  <script>
    (async()=>{const el=document.getElementById('city');try{const r=await fetch('https://ipapi.co/json/',{cache:'no-store'});if(!r.ok)throw 0;const d=await r.json();el.textContent=d.city||d.region||d.country_name||'your area'}catch{el.textContent='your area'}})();
  </script>
</body>
</html>
